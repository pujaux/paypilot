<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PayPilot — Recovery Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #05070c;
    --bg-glow-1: #0b3a8a;
    --bg-glow-2: #071a3d;
    --panel-border: rgba(255,255,255,0.08);
    --text: #e8edf6;
    --muted: #7c8aa3;
    --accent: #4f8bff;
    --ok: #4ee1a0;
    --warn: #ffb454;
    --bad: #ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse 120% 60% at 50% -10%, var(--bg-glow-1) 0%, transparent 55%),
                radial-gradient(ellipse 100% 50% at 80% 110%, var(--bg-glow-2) 0%, transparent 60%),
                var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .display{ font-family: 'Space Grotesk', sans-serif; }
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 64px 28px 100px; }
  header{
    display:flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 56px; flex-wrap: wrap; gap: 20px;
    border-bottom: 1px solid var(--panel-border); padding-bottom: 32px;
  }
  header .mark{ display:flex; align-items:center; gap: 10px; }
  header .dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px 2px var(--accent); }
  header h1{ font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header p{ margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  header .status{ font-size: 13px; color: var(--muted); text-align: right; }
  header .status span{ color: var(--ok); }
  .stats{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--panel-border); border: 1px solid var(--panel-border);
    border-radius: 14px; overflow:hidden; margin-bottom: 48px;
  }
  .stat{ background: rgba(6,10,20,0.7); padding: 26px 24px; }
  .stat .num{ font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .stat .label{ color: var(--muted); font-size: 13px; margin-top: 10px; }
  section h2{ font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 4px; }
  section .sub{ color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .table-panel{ border: 1px solid var(--panel-border); border-radius: 14px; background: rgba(255,255,255,0.015); overflow: hidden; }
  .row{
    display: grid; grid-template-columns: 100px 140px 1fr 1fr 90px; gap: 18px;
    padding: 18px 22px; border-bottom: 1px solid var(--panel-border); align-items: center;
  }
  .row:last-child{ border-bottom:none; }
  .row.head{ color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 16px; padding-bottom: 16px; }
  .row .amount{ font-family: 'Space Grotesk', sans-serif; font-weight: 500; }
  .row .reason{ color: var(--muted); font-size: 13px; line-height: 1.4; }
  .row .msg{ font-size: 13px; line-height: 1.45; color: #c7d1e3; }
  .badge{ display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; width: fit-content; }
  .badge.card_declined, .badge.invalid_card{ background: rgba(255,107,107,0.12); color: var(--bad); }
  .badge.insufficient_funds{ background: rgba(255,180,84,0.12); color: var(--warn); }
  .badge.international_card_blocked, .badge.network_error{ background: rgba(79,139,255,0.14); color: var(--accent); }
  .badge.expired_card{ background: rgba(199,209,227,0.1); color: var(--muted); }
  .badge.other, .badge.pending{ background: rgba(199,209,227,0.08); color: var(--muted); }
  .status-pill{ font-size: 12px; color: var(--ok); display:flex; align-items:center; gap: 6px; }
  .status-pill::before{ content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .empty, .loading{ padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  footer{ margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 720px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
    .row{ grid-template-columns: 1fr; gap: 6px; padding: 16px 18px; }
    .row.head{ display:none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = "https://cfmgdyjaafakqslcikba.supabase.co";
const SUPABASE_KEY = "sb_publishable_MPPWf04cJRU2rV1HQMBbOg_k2ebKWig";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function categoryLabel(cat) {
  if (!cat) return "Pending";
  return cat.replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
}

function App() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [payments, setPayments] = useState([]);

  async function load() {
    const { data: paymentsData } = await supabase.from("payments").select("*").order("created_at", { ascending: false });
    const { data: failuresData } = await supabase.from("failures").select("*").order("created_at", { ascending: false });
    const { data: recoveryData } = await supabase.from("recovery_actions").select("*");

    const merged = (failuresData || []).map(f => {
      const payment = (paymentsData || []).find(p => p.id === f.payment_id);
      const recovery = (recoveryData || []).find(r => r.failure_id === f.id);
      return { failure: f, payment, recovery };
    });

    setRows(merged);
    setPayments(paymentsData || []);
    setLoading(false);
  }

  useEffect(() => {
    load();
    const interval = setInterval(load, 15000);
    return () => clearInterval(interval);
  }, []);

  const triggerTest = async (type) => {
  try {
    const res = await fetch(`/api/test-failure?type=${type}`, { method: 'POST' });
    if (res.ok) {
      // Reload data immediately after trigger
      await new Promise(r => setTimeout(r, 500));
      load();
    } else {
      alert('Test trigger failed. Check console.');
    }
  } catch (err) {
    console.error('Trigger error:', err);
  }
};

const buttonStyle = {
  padding: '10px 16px',
  border: 'none',
  borderRadius: '8px',
  background: 'var(--accent)',
  color: '#fff',
  fontSize: '13px',
  fontWeight: 500,
  cursor: 'pointer',
  transition: 'opacity 0.2s',
  boxShadow: '0 0 12px rgba(79, 139, 255, 0.3)'
};

  const totalFailed = rows.length;
  const totalCaptured = payments.filter(p => p.status === "captured").length;
  const classified = rows.filter(r => r.failure.category).length;
  const drafted = rows.filter(r => r.recovery).length;

  

  return (
    <div className="wrap">
      <header>
  <div>
    <div className="mark">
      <span className="dot"></span>
      <h1 className="display">PayPilot</h1>
    </div>
    <p>Payment failure recovery — live console</p>
  </div>
  <div className="status">
    Connected to Razorpay test mode<br/>
    <span>● live</span> · refreshes every 15s
  </div>
</header>

<div style={{ marginBottom: '48px', padding: '24px', border: '1px solid var(--panel-border)', borderRadius: '14px', background: 'rgba(255,255,255,0.015)' }}>
  <p style={{ margin: '0 0 16px 0', color: 'var(--muted)', fontSize: '13px', fontWeight: 500 }}>Demo: Trigger test failures</p>
  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px' }}>
    <button onClick={() => triggerTest('insufficient_funds')} style={buttonStyle}>₹ Insufficient Funds</button>
    <button onClick={() => triggerTest('card_expired')} style={buttonStyle}>🗓️ Card Expired</button>
    <button onClick={() => triggerTest('international_card_blocked')} style={buttonStyle}>🌍 International Block</button>
    <button onClick={() => triggerTest('network_error')} style={buttonStyle}>⚡ Network Error</button>
    <button onClick={() => triggerTest('card_declined')} style={buttonStyle}>❌ Card Declined</button>
  </div>
</div>

      <section>
        <h2>Recent failures</h2>
        <p className="sub">Every failed payment, its AI-assigned category, and the drafted recovery message.</p>
        <div className="table-panel">
          <div className="row head">
            <div>Amount</div><div>Category</div><div>Reason</div><div>Recovery message</div><div>Status</div>
          </div>
          {loading && <div className="loading">Loading failures…</div>}
          {!loading && rows.length === 0 && (
            <div className="empty">No failures yet. Trigger a test payment failure to see it appear here.</div>
          )}
          {!loading && rows.map(({ failure, payment, recovery }) => (
            <div className="row" key={failure.id}>
              <div className="amount display">{payment ? `₹${payment.amount}` : "—"}</div>
              <div><span className={"badge " + (failure.category || "pending")}>{categoryLabel(failure.category)}</span></div>
              <div className="reason">{failure.reason}</div>
              <div className="msg">{recovery ? recovery.message : "Drafting…"}</div>
              <div>
                {recovery ? <span className="status-pill">Sent</span> : <span className="status-pill" style={{color:"var(--muted)"}}>Waiting</span>}
              </div>
            </div>
          ))}
        </div>
      </section>

      <footer>PayPilot · built on Razorpay test mode, Supabase, and Groq</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
